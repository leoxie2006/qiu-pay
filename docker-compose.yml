services:
  qiu-pay:
    image: qiusheng26/qiu-pay:latest
    container_name: qiu-pay
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./data:/app/data
      - type: bind
        source: ${HOST_TIMEZONE_FILE:-/etc/localtime}
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - .env
